<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ABS Inventory Assistant</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 20px; }
        .menu { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        button { padding: 10px 16px; cursor: pointer; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5; }
        button:hover { background: #e0e0e0; }
        #chat { border: 1px solid #ccc; border-radius: 6px; padding: 16px; height: 400px; overflow-y: auto; margin-bottom: 12px; }
        .msg { margin: 8px 0; padding: 8px 12px; border-radius: 6px; }
        .user { background: #e3f2fd; text-align: right; }
        .bot { background: #f1f8e9; }
        input[type="text"] { width: 70%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        #send { padding: 10px 20px; }
    </style>
</head>
<body>
    <h1>🤖 AI-помощник по складу</h1>

    <div class="menu">
        <button onclick="send('Какие остатки на складе?')">📦 Остатки</button>
        <button onclick="send('Какие товары в дефиците?')">⚠️ Дефицит</button>
        <button onclick="send('Что скоро истекает?')">⏰ Срок годности</button>
        <button onclick="send('Сколько закупить масла массажного на месяц?')">📈 Прогноз</button>
        <button onclick="send('Какой бюджет на закупки?')">💰 Бюджет</button>
        <button onclick="send('Что ты умеешь?')">❓ Помощь</button>
    </div>

    <div id="chat"></div>
    <input type="text" id="input" placeholder="Задайте вопрос..." onkeydown="if(event.key==='Enter') send()">
    <button id="send" onclick="send()">Отправить</button>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = 'msg ' + cls;
            div.innerHTML = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\n/g, '<br>');
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send(text) {
            const msg = text || input.value.trim();
            if (!msg) return;
            input.value = '';
            addMsg(msg, 'user');

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                const data = await res.json();
                addMsg(data.response, 'bot');
            } catch (e) {
                addMsg('Ошибка: ' + e.message, 'bot');
            }
        }
    </script>
</body>
</html>
